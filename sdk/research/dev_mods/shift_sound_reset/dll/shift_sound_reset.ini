; Shift Sound Reset - edit with the game closed.
; A missing or invalid value uses the default shown here.

[Mod]
; 1 = restart the engine sound on gear changes, 0 = the game sounds as normal.
Enabled=1
; Fade-in after each restart, in milliseconds (0 = no fade, max 1000).
FadeInMs=30
; Restart on upshifts (1 = yes, 0 = no).
Upshifts=1
; Restart on downshifts (1 = yes, 0 = no).
Downshifts=1

[Advanced]
; The car you are watching (your own, or another car you switch to with +/-)
; is found by its engine sound: the closest one within SearchMeters of the
; car (0.5-5.0). Every sound within MatchMeters of that one (0.05-1.0) is
; treated as the same car's. Other cars can use the same sound files; this
; keeps their sounds untouched.
SearchMeters=2.0
MatchMeters=0.25
; 1 = write shift_sound_reset_log.txt beside the mod, with one line per shift
; (for troubleshooting). 0 = no log file.
Log=0
