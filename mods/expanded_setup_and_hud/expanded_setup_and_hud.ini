; expanded_setup_and_hud.ini - Expanded Setup and HUD settings
; Change a value with Notepad, save the file, then restart the game.

[ExpandedSetupAndHud]
; 1 = mod enabled, 0 = disabled (vanilla behavior)
Enabled=1
; 1 = tune Car Status LCD wing and chassis damage colors (Green = 0, Yellow -> Orange -> Red gradient)
CarStatusDamageColors=1
; Suspension / wheel bend angle in degrees that maps to full Red (1 to 20, default 5).
SuspensionMaxBendDegrees=5
; 1 = enable interactive Mid-Race Setup LCD screen (Mode 5)
MidRaceSetupLCD=1

; Advanced: select which parameters appear on the Mid-Race Setup LCD (1 = show, 0 = hide).
; If all parameters are set to 0, the Mode 5 LCD screen is automatically disabled.
ShowRevLimit=1
ShowEngineMap=1
ShowEngineBrake=1
ShowBrakeBias=1
ShowDiffPreload=1
ShowDiffPower=1
ShowDiffCoast=1
ShowDiffPump=1
ShowTcGripMult=1
ShowTcGripAdd=1
ShowAbsGripMult=1
ShowAbsGripAdd=1

; Fuel Mixture Engine Map scaling per step relative to the middle map setting (Map 3 of 5 = vanilla).
; Higher map = richer mix (more torque, power, fuel burn, and heat). Lower map = leaner mix.
EngineMapFuelStep=0.020
EngineMapHeatStep=0.025
EngineMapBoostTorque=0.0075
EngineMapBoostPower=0.000250

; 1 = enable dynamic AI Engine Map selection (session, battles, strategy, fuel, engine life) and extra race fuel
AiDynamicEngineMap=1
